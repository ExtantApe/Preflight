name: Preflight
version: ${project.version}
main: io.github.extantape.preflight.plugin.PreflightPlugin
api-version: '1.21'
description: Runs smoke tests at boot and holds players back if the server is broken.
commands:
  preflight:
    description: Shows test results or lifts a lockdown.
    usage: /preflight <status|unlock>
    permission: preflight.admin
permissions:
  preflight.admin:
    description: Use /preflight
    default: op
